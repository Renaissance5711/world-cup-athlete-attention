name: TEM Stage 2 V5 Full Expansion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tem-stage2-v5.yml'
      - 'tem_stage2_v5_payload/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PAYLOAD_URL: 'https://drive.usercontent.google.com/download?id=1S_NZtREGyBk0f4_igBEPu93m5KlUtQqP&export=download&confirm=t'
  PAYLOAD_SHA256: 'da6058a5e41e9d63f2b367f84c92effe5ca371878aa959bc88a2b83b5639f87c'
  PAYLOAD_BYTES: '562854'

jobs:
  full-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out run branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download resume payload and load ephemeral credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/outputs
          curl --location --fail --show-error --silent \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --output runtime/payload.tar.gz "${PAYLOAD_URL}"
          test "$(stat -c%s runtime/payload.tar.gz)" = "${PAYLOAD_BYTES}"
          echo "${PAYLOAD_SHA256}  runtime/payload.tar.gz" | sha256sum --check --strict
          gzip -t runtime/payload.tar.gz
          sha256sum runtime/payload.tar.gz | tee runtime/outputs/runtime_payload.sha256
          tar -xzf runtime/payload.tar.gz -C runtime
          root=runtime/tem_stage2_v5_resume_payload
          key_file="$root/credential/openalex_api_key.txt"
          test -s "$key_file"
          OPENALEX_KEY="$(tr -d '\r\n' < "$key_file")"
          test -n "$OPENALEX_KEY"
          echo "::add-mask::$OPENALEX_KEY"
          printf 'OPENALEX_API_KEY=%s\n' "$OPENALEX_KEY" >> "$GITHUB_ENV"
          unset OPENALEX_KEY
          shred -u "$key_file" || rm -f "$key_file"
          mv "$root/code" runtime/code
          mv "$root/v3_input" runtime/outputs/v3_input
          rm -rf "$root"
          shred -u runtime/payload.tar.gz || rm -f runtime/payload.tar.gz
          test ! -e runtime/payload.tar.gz
          find runtime/code -maxdepth 3 -type f | sort

      - name: Install dependencies
        working-directory: runtime/code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run V5 regression tests
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        run: pytest -q tests_v5

      - name: Validate prebuilt V3 1,881-project input
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('../outputs/v3_input')
          audit=json.loads((root/'v3_stage2_input_audit.json').read_text())
          expected={
            'matched_rows':7839,'matched_unique_dois':7709,'strict_rows':6602,
            'strict_authors':273,'strict_projects':6536,'stage2_projects':1881,
          }
          assert audit['count_assertions']==expected, audit
          projects=pd.read_csv(root/'risk_set_full_firm_projects_input_v3.csv')
          strict=pd.read_csv(root/'author_project_panel_v3_strict.csv')
          assert len(projects)==1881 and projects['work_id'].nunique()==1881
          assert len(strict)==6602 and strict['author_id'].nunique()==273
          print(json.dumps(expected,indent=2))
          PY

      - name: Restore restartable OpenAlex cache
        id: cache-openalex
        uses: actions/cache@v4
        with:
          path: runtime/openalex_cache
          key: tem-stage2-v5-openalex-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tem-stage2-v5-openalex-

      - name: Run full relationship-transition extraction and models
        id: stage2
        continue-on-error: true
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        shell: bash
        run: |
          set +e
          mkdir -p ../outputs/stage2_v5 ../openalex_cache
          python run_stage2_v5_relationship_transition.py \
            --projects ../outputs/v3_input/risk_set_full_firm_projects_input_v3.csv \
            --strict-panel ../outputs/v3_input/author_project_panel_v3_strict.csv \
            --cache-dir ../openalex_cache \
            --output-dir ../outputs/stage2_v5 \
            --bootstrap-reps 1000 \
            --field-top-n 100 \
            --cognitive-batch-size 20 \
            2>&1 | tee ../outputs/stage2_v5.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee ../outputs/stage2_v5_exit_code.txt
          exit "$code"

      - name: Record run diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p runtime/outputs/stage2_v5
          (
            cd runtime/code
            PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.openalex_stage2 import OpenAlexClient
          from run_stage2_v5_relationship_transition import sanitize_rate_limit_status
          output=Path('../outputs/stage2_v5/openalex_rate_limit_end.json')
          try:
              payload=sanitize_rate_limit_status(OpenAlexClient().rate_limit_status())
          except Exception as exc:
              payload={'status':'unavailable','error':type(exc).__name__}
          output.write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
          )
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "cache_hit=${{ steps.cache-openalex.outputs.cache-hit }}"
            echo "stage2_outcome=${{ steps.stage2.outcome }}"
            echo "utc_finished=$(date -u +%FT%TZ)"
          } | tee runtime/outputs/github_run_metadata.txt
          if [ -f runtime/outputs/stage2_v5/run_status.json ]; then
            cat runtime/outputs/stage2_v5/run_status.json
          fi
          du -sh runtime/openalex_cache runtime/outputs 2>/dev/null || true
          find runtime/outputs -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort || true
          test ! -e runtime/tem_stage2_v5_resume_payload/credential/openalex_api_key.txt

      - name: Upload results and diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tem-stage2-v5-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/outputs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
