name: TEM Stage 2 V5 Full Expansion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tem-stage2-v5.yml'
      - '.github/scripts/reconstruct_stage2_payload.py'
      - '.github/overlays/stage2_models.py'
      - '.github/overlays/stage2_openalex_extract.py'
      - '.github/overlays/test_cache_compaction.py'
      - 'tem_stage2_v5_payload/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  V3_PAYLOAD_FILE_ID: '1S_NZtREGyBk0f4_igBEPu93m5KlUtQqP'
  V3_PAYLOAD_SHA256: '77652f613b548d012b65efcd0be43d5b123d97f4df7c9ff4063e8da7341b75fd'
  V3_PAYLOAD_BYTES: '512011'

jobs:
  full-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out run branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct code, download verified V3 input, and load GitHub secret
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENALEX_API_KEY:-}"
          echo "::add-mask::$OPENALEX_API_KEY"
          printf 'OPENALEX_API_KEY=%s\n' "$OPENALEX_API_KEY" >> "$GITHUB_ENV"

          mkdir -p runtime/outputs runtime/openalex_cache runtime/unpack/code runtime/unpack/panel
          python .github/scripts/reconstruct_stage2_payload.py \
            --parts 'tem_stage2_v5_payload/code/part_*.b64' \
            --destination runtime/unpack/code \
            --required run_stage2_v5_relationship_transition.py \
            --required requirements.txt

          panel_payload=runtime/panel_payload.tar.gz
          panel_ok=false
          for source in \
            "usercontent|https://drive.usercontent.google.com/download?id=${V3_PAYLOAD_FILE_ID}&export=download&confirm=t" \
            "drive-uc|https://drive.google.com/uc?export=download&id=${V3_PAYLOAD_FILE_ID}&confirm=t"
          do
            source_name="${source%%|*}"
            source_url="${source#*|}"
            for attempt in 1 2 3 4 5; do
              rm -f "$panel_payload"
              if curl --location --fail --show-error --silent \
                --connect-timeout 30 --max-time 180 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                --output "$panel_payload" "$source_url"; then
                actual_bytes="$(stat -c%s "$panel_payload" 2>/dev/null || echo 0)"
                actual_sha="$(sha256sum "$panel_payload" | awk '{print $1}')"
                if [ "$actual_bytes" = "${V3_PAYLOAD_BYTES}" ] \
                  && [ "$actual_sha" = "${V3_PAYLOAD_SHA256}" ] \
                  && gzip -t "$panel_payload"; then
                  panel_ok=true
                  echo "Verified V3 payload source=$source_name attempt=$attempt bytes=$actual_bytes"
                  break 2
                fi
                echo "V3 payload validation failed source=$source_name attempt=$attempt bytes=$actual_bytes sha256=$actual_sha"
              else
                echo "V3 payload download failed source=$source_name attempt=$attempt"
              fi
              sleep $((attempt * 5))
            done
          done
          test "$panel_ok" = true
          tar -xzf "$panel_payload" -C runtime/unpack/panel

          code_entry="$(find runtime/unpack/code -type f -name run_stage2_v5_relationship_transition.py -print -quit)"
          test -n "$code_entry"
          code_root="$(dirname "$code_entry")"
          mkdir -p runtime/code
          cp -a "$code_root"/. runtime/code/
          cp .github/overlays/stage2_models.py runtime/code/src/stage2_models.py
          cp .github/overlays/stage2_openalex_extract.py runtime/code/src/stage2_openalex_extract.py
          cp .github/overlays/test_cache_compaction.py runtime/code/tests_v5/test_cache_compaction.py

          panel_entry="$(find runtime/unpack/panel -type f -name risk_set_full_firm_projects_input_v3.csv -print -quit)"
          test -n "$panel_entry"
          panel_root="$(dirname "$panel_entry")"
          mkdir -p runtime/outputs/v3_input
          cp -a "$panel_root"/. runtime/outputs/v3_input/

          rm -rf runtime/unpack runtime/panel_payload.tar.gz

          test -s runtime/code/run_stage2_v5_relationship_transition.py
          test -s runtime/code/requirements.txt
          test -s runtime/code/src/stage2_models.py
          test -s runtime/code/src/stage2_openalex_extract.py
          test -s runtime/code/tests_v5/test_cache_compaction.py
          test -s runtime/outputs/v3_input/risk_set_full_firm_projects_input_v3.csv
          test -s runtime/outputs/v3_input/author_project_panel_v3_strict.csv
          test -s runtime/outputs/v3_input/author_project_panel_v3_scored.csv
          test -s runtime/outputs/v3_input/v3_stage2_input_audit.json
          find runtime/code -maxdepth 3 -type f | sort

      - name: Install dependencies
        working-directory: runtime/code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run V5 regression tests
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        run: pytest -q tests_v5

      - name: Validate prebuilt V3 1,881-project input
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('../outputs/v3_input')
          audit=json.loads((root/'v3_stage2_input_audit.json').read_text())
          expected={
            'matched_rows':7839,'matched_unique_dois':7709,'strict_rows':6602,
            'strict_authors':273,'strict_projects':6536,'stage2_projects':1881,
          }
          assert audit['count_assertions']==expected, audit
          projects=pd.read_csv(root/'risk_set_full_firm_projects_input_v3.csv')
          strict=pd.read_csv(root/'author_project_panel_v3_strict.csv')
          scored=pd.read_csv(root/'author_project_panel_v3_scored.csv')
          matched=scored[scored['score_matched'].astype(bool)]
          assert len(projects)==1881 and projects['work_id'].nunique()==1881
          assert len(strict)==6602 and strict['author_id'].nunique()==273
          assert len(scored)==9413 and len(matched)==7839 and matched['doi'].nunique()==7709
          print(json.dumps(expected,indent=2))
          PY

      - name: Restore restartable OpenAlex cache
        id: cache-openalex
        uses: actions/cache/restore@v4
        with:
          path: runtime/openalex_cache
          key: tem-stage2-v5-openalex-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tem-stage2-v5-openalex-30734912133-1
            tem-stage2-v5-openalex-

      - name: Run full relationship-transition extraction and models
        id: stage2
        continue-on-error: true
        working-directory: runtime/code
        env:
          PYTHONPATH: '.'
        shell: bash
        run: |
          set +e
          mkdir -p ../outputs/stage2_v5 ../openalex_cache
          python run_stage2_v5_relationship_transition.py \
            --projects ../outputs/v3_input/risk_set_full_firm_projects_input_v3.csv \
            --strict-panel ../outputs/v3_input/author_project_panel_v3_strict.csv \
            --cache-dir ../openalex_cache \
            --output-dir ../outputs/stage2_v5 \
            --bootstrap-reps 1000 \
            --field-top-n 100 \
            --cognitive-batch-size 20 \
            2>&1 | tee ../outputs/stage2_v5.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee ../outputs/stage2_v5_exit_code.txt
          exit "$code"

      - name: Save restartable OpenAlex cache checkpoint
        id: save-openalex
        if: always() && steps.cache-openalex.outcome == 'success' && steps.stage2.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: runtime/openalex_cache
          key: tem-stage2-v5-openalex-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record run diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p runtime/outputs/stage2_v5
          if [ -d runtime/code ]; then
            (
              cd runtime/code
              PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.openalex_stage2 import OpenAlexClient
          output=Path('../outputs/stage2_v5/openalex_rate_limit_end.json')
          try:
              payload=OpenAlexClient().rate_limit_status()
          except Exception as exc:
              payload={'status':'unavailable','error':type(exc).__name__}
          output.write_text(json.dumps(payload,indent=2),encoding='utf-8')
          PY
            ) || true
          fi
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit=${GITHUB_SHA}"
            echo "cache_hit=${{ steps.cache-openalex.outputs.cache-hit }}"
            echo "cache_save_outcome=${{ steps.save-openalex.outcome }}"
            echo "stage2_outcome=${{ steps.stage2.outcome }}"
            echo "utc_finished=$(date -u +%FT%TZ)"
          } | tee runtime/outputs/github_run_metadata.txt
          if [ -f runtime/outputs/stage2_v5/run_status.json ]; then
            cat runtime/outputs/stage2_v5/run_status.json
          fi
          du -sh runtime/openalex_cache runtime/outputs 2>/dev/null || true
          find runtime/openalex_cache -type f -printf '%s\t%p\n' 2>/dev/null \
            | sort -nr | head -n 20 \
            > runtime/outputs/stage2_v5/largest_cache_files.tsv || true
          find runtime/outputs -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort || true
          test -z "$(find runtime -type f -name openalex_api_key.txt -print -quit 2>/dev/null)"

      - name: Upload results and diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tem-stage2-v5-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/outputs
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Enforce Stage 2 exit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          exit_file=runtime/outputs/stage2_v5_exit_code.txt
          test -s "$exit_file"
          code="$(tr -d '\r\n' < "$exit_file")"
          case "$code" in
            ''|*[!0-9]*)
              echo "Invalid Stage 2 exit code"
              exit 1
              ;;
          esac
          echo "stage2_exit_code=$code"
          test "$code" -eq 0
