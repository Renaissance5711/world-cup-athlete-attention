name: TEM Stage 2 Code Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tem-stage2-code-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct code snapshot
        run: |
          set -euo pipefail
          mkdir -p runtime/code
          python .github/scripts/reconstruct_stage2_payload.py \
            --parts 'tem_stage2_v5_payload/code/part_*.b64' \
            --destination runtime/code \
            --required run_stage2_v5_relationship_transition.py \
            --required requirements.txt
          find runtime/code -type f -printf '%p\t%s bytes\n' | sort
      - name: Upload code snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tem-stage2-code-snapshot-${{ github.run_id }}
          path: runtime/code
          if-no-files-found: error
          retention-days: 1
