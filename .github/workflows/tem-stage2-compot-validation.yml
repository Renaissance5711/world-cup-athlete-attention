name: TEM Stage 2 COMPOT Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tem-stage2-compot-validation.yml'
      - '.github/overlays/stage2_compot_*.py'
      - '.github/overlays/run_stage2_compot_validation.py'
      - '.github/overlays/test_stage2_compot_*.py'

concurrency:
  group: tem-stage2-compot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy statsmodels pytest

      - name: Run COMPOT RED tests
        env:
          PYTHONPATH: '.github/overlays'
        run: pytest -q .github/overlays/test_stage2_compot_*.py
