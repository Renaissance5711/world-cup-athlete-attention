name: TEM Stage 2 COMPOT Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tem-stage2-compot-validation.yml'
      - '.github/overlays/stage2_compot_*.py'
      - '.github/overlays/run_stage2_compot_validation.py'
      - '.github/overlays/test_stage2_compot_*.py'

concurrency:
  group: tem-stage2-compot-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  V3_ARTIFACT_ID: '8828825689'
  V3_ARTIFACT_SHA256: 'aebc17b63eac2f0ea201b4479963c4401efc5fb62342f7ec43a6f6e13900547b'
  V3_ARTIFACT_BYTES: '2495057'
  PILOT_ARTIFACT_ID: '9041032423'
  PILOT_ARTIFACT_SHA256: 'c10c6f544de773eaa61d9091a640cef74ae0338a842377750876d178398fc2e7'
  PILOT_ARTIFACT_BYTES: '1182310446'

jobs:
  compot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy statsmodels pytest

      - name: Run COMPOT and baseline regression tests
        env:
          PYTHONPATH: '.github/overlays'
        run: |
          pytest -q \
            .github/overlays/test_stage2_compot_*.py \
            .github/overlays/test_stage2_pilot_models.py

      - name: Download verified V3 and successful 400-project outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/input runtime/pilot runtime/compot_outputs

          v3_zip=runtime/v3_input_artifact.zip
          curl --location --fail --show-error --silent \
            --connect-timeout 30 --max-time 300 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$v3_zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V3_ARTIFACT_ID}/zip"
          test "$(stat -c%s "$v3_zip")" = "${V3_ARTIFACT_BYTES}"
          echo "${V3_ARTIFACT_SHA256}  $v3_zip" | sha256sum --check --strict
          unzip -q "$v3_zip" \
            'v3_input/author_project_panel_v3_strict.csv' \
            'v3_input/risk_set_full_firm_projects_input_v3.csv' \
            -d runtime/input

          pilot_zip=runtime/pilot_artifact.zip
          curl --location --fail --show-error --silent \
            --connect-timeout 30 --max-time 1200 \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$pilot_zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PILOT_ARTIFACT_ID}/zip"
          test "$(stat -c%s "$pilot_zip")" = "${PILOT_ARTIFACT_BYTES}"
          echo "${PILOT_ARTIFACT_SHA256}  $pilot_zip" | sha256sum --check --strict
          unzip -q "$pilot_zip" \
            'stage2_realization_pilot/cognitive_candidate_long_top50.csv' \
            'stage2_realization_pilot/cognitive_candidate_long_top100.csv' \
            -d runtime/pilot

          rm -f "$v3_zip" "$pilot_zip"
          test -s runtime/input/v3_input/author_project_panel_v3_strict.csv
          test -s runtime/input/v3_input/risk_set_full_firm_projects_input_v3.csv
          test -s runtime/pilot/stage2_realization_pilot/cognitive_candidate_long_top50.csv
          test -s runtime/pilot/stage2_realization_pilot/cognitive_candidate_long_top100.csv

      - name: Run Stage A and Stage B COMPOT validation
        env:
          PYTHONPATH: '.github/overlays'
        run: |
          python .github/overlays/run_stage2_compot_validation.py \
            --strict-panel runtime/input/v3_input/author_project_panel_v3_strict.csv \
            --projects runtime/input/v3_input/risk_set_full_firm_projects_input_v3.csv \
            --top50 runtime/pilot/stage2_realization_pilot/cognitive_candidate_long_top50.csv \
            --top100 runtime/pilot/stage2_realization_pilot/cognitive_candidate_long_top100.csv \
            --output-dir runtime/compot_outputs \
            --bootstrap-reps 500

      - name: Verify compact output contract
        env:
          PYTHONPATH: '.github/overlays'
        run: |
          python - <<'PY'
          from pathlib import Path
          from run_stage2_compot_validation import required_compot_output_filenames
          root = Path('runtime/compot_outputs')
          missing = [name for name in required_compot_output_filenames() if not (root / name).is_file()]
          assert not missing, missing
          print('\n'.join(sorted(path.name for path in root.iterdir() if path.is_file())))
          PY

      - name: Upload COMPOT validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: tem-stage2-compot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/compot_outputs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
